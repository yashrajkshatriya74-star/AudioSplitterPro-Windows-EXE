name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pydub numpy pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "AudioSplitterPro" main.py

      - name: Upload EXE as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioSplitterPro-Windows-EXE
          path: dist/AudioSplitterPro.exe
